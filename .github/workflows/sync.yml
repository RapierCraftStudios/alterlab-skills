name: Sync published skills
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync.py
      - name: Commit changes
        run: |
          git config user.name "alterlab-skills-mirror"
          git config user.email "support@alterlab.io"
          git add -A
          git diff --cached --quiet || (git commit -m "Sync published agent skills" && git push)
